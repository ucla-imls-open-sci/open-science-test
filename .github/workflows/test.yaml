name: "Test Content Checker"

on:
  push:

jobs:
  check-content:
    name: "Check the content of the lesson"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v2

      - name: Run the Content Checker
        run: | 
          git clone https://github.com/ucla-imls-open-sci/imls-tools ./imls-tools
          ./imls-tools/content-checker/content_checker.sh -P ./
